apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: flask-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-web
  template:
    metadata:
      labels:
        app: flask-web
    spec:
      containers:
      - name: flask-container
        image: python:3.9-slim
        command: ["sh", "-c", "pip install flask && python -c 'from flask import Flask; app=Flask(__name__); app.add_url_rule(\"/\", view_func=lambda: \"Hello from Dockerized App!\"); app.run(host=\"0.0.0.0\", port=5000)'"]
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask-web
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
