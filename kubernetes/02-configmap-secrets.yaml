apiVersion: v1
kind: ConfigMap
metadata:
  name: payshield-config
  namespace: payshield-production
data:
  APP_ENV: "production"
  APP_VERSION: "v2.4.0"
  LOG_LEVEL: "INFO"
  PCI_STRICT_MODE: "true"
  FRAUD_DETECTION_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: payshield-secrets
  namespace: payshield-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://payshield_admin:fintech_secure_vault_pw@db.internal:5432/payshield"
  JWT_SECRET: "k8s-fintech-jwt-hmac-sha512-secure-token"
  REDIS_PASSWORD: "vault-redis-auth-token-42"
