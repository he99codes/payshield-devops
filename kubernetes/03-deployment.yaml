apiVersion: apps/v1
kind: Deployment
metadata:
  name: payshield-payment-api
  namespace: payshield-production
  labels:
    app.kubernetes.io/name: payshield-payment-api
    app.kubernetes.io/part-of: payshield-fintech
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payshield-payment-api
  template:
    metadata:
      labels:
        app: payshield-payment-api
        tier: backend
        domain: payment-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: payment-api
        image: he99codes/payshield-payment-api:v2.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: payshield-config
        - secretRef:
            name: payshield-secrets
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
