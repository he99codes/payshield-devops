apiVersion: v1
kind: Service
metadata:
  name: payshield-service
  namespace: payshield-production
  labels:
    app.kubernetes.io/name: payshield-payment-api
spec:
  type: NodePort
  selector:
    app: payshield-payment-api
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: payshield-loadbalancer
  namespace: payshield-production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: payshield-payment-api
  ports:
  - name: https
    port: 443
    targetPort: 5000
