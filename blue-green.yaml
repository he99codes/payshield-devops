apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web
        version: blue
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
---
apiVersion: v1
kind: Service
metadata:
  name: web-production-service
spec:
  selector:
    app: web
    version: blue # Traffic currently goes to Blue
  ports:
  - port: 80
    targetPort: 80
